services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PROD_DB_NAME}
      POSTGRES_USER: ${PROD_DB_USER}
      POSTGRES_PASSWORD: ${PROD_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PROD_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PROD_DB_USER}:${PROD_DB_PASSWORD}@db:5432/${PROD_DB_NAME}
      PROD_DB_HOST: db
      PROD_DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      PROD_DB_HOST: db
      PROD_DB_PORT: "5432"
      DATABASE_URL: postgresql+asyncpg://${PROD_DB_USER}:${PROD_DB_PASSWORD}@db:5432/${PROD_DB_NAME}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${PROD_DB_USER}:${PROD_DB_PASSWORD}@db:5432/${PROD_DB_NAME}
      PROD_DB_HOST: db
      PROD_DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    profiles:
      - bot
    environment:
      PROD_DB_HOST: db
      PROD_DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      INTERNAL_API_URL: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:stable
    network_mode: host
    depends_on:
      bot:
        condition: service_started
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale_data:/var/lib/tailscale

volumes:
  postgres_data:
  tailscale_data:
