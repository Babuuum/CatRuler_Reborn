name: catruler-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catruler_test
      POSTGRES_USER: catruler_test
      # Disposable local test data only; never use this configuration in production.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catruler_test -d catruler_test"]
      interval: 1s
      timeout: 5s
      retries: 30
