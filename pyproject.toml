[tool.poetry]
name = "catruler-reborn"
version = "0.1.0"
description = ""
authors = ["Babuuum <darckiller@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
requests = ">=2.32.5,<3.0.0"
fastapi = ">=0.133.0,<0.134.0"
aiogram = ">=3.22.0,<4.0.0"
uvicorn = {extras = ["standard"], version = ">=0.41.0,<0.42.0"}
pydantic-settings = ">=2.13.1,<3.0.0"
httpx = ">=0.28.1,<0.29.0"
sqlalchemy = ">=2.0.47,<3.0.0"
cryptography = ">=46.0.5,<47.0.0"
aioboto3 = ">=15.5.0,<16.0.0"
asyncpg = "^0.31.0"
structlog = "^25.5.0"
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
celery = "^5.6.2"
redis = "^7.3.0"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.4.4,<0.5.0"
black = ">=24.4.2,<25.0.0"
pytest = ">=8.2.0,<9.0.0"
pytest-asyncio = ">=0.23.7,<0.24.0"
pytest-cov = ">=5.0.0,<6.0.0"
coverage = ">=7.5.1,<8.0.0"
pre-commit = ">=3.7.0,<4.0.0"
alembic = ">=1.13.1,<2.0.0"
pytest-env = ">=1.1.3,<2.0.0"
aiosqlite = ">=0.21.0,<0.22.0"

[tool.poetry.group.test.dependencies]
pytest-mock = ">=3.14.0,<4.0.0"
factory-boy = ">=3.3.0,<4.0.0"
faker = ">=25.2.0,<26.0.0"
pytest-asyncio = "^0.23.7"
httpx = "^0.28.1"
aiosqlite = "^0.21.0"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = [
    "ENVIRONMENT=test"
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
